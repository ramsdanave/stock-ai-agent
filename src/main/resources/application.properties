spring.application.name=stock-ai-agent

# =========================================================
# MySQL Database
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Spring AI - Google Gemini Chat
# =========================================================

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# =========================================================
# Google Gemini Embeddings - RAG
# =========================================================

spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
# =========================================================
# Angel One SmartAPI
# =========================================================

angelone.api-key=${ANGELONE_API_KEY}
angelone.client-id=${ANGELONE_CLIENT_ID}
angelone.pin=${ANGELONE_PIN}
angelone.totp-secret=${ANGELONE_TOTP_SECRET}

# =========================================================
# Server
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0

